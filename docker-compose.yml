services:
  postgres:
    image: postgres:15-alpine
    container_name: deployment-tracker-db
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops123
      POSTGRES_DB: deployments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d deployments"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: deployment-tracker-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devops:devops123@postgres:5432/deployments
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
